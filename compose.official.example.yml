# Copy to a restricted server and inject secrets from the host environment.
# HTTPS/WSS should be terminated by your deployment provider/reverse proxy.
services:
  xtank:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      XTANK_OFFICIAL_MODE: "1"
      XTANK_REGION: ${XTANK_REGION:-asia-east}
      # Required for cross-server ticket allocation, never guess the hostname.
      XTANK_PUBLIC_WSS_URL: ${XTANK_PUBLIC_WSS_URL:-}
      PORT: "8787"
      BIND_HOST: 0.0.0.0
      XTANK_SETTLEMENT_DIR: /data/settlements
      SUPABASE_URL: ${SUPABASE_URL:?Set the HTTPS Supabase URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?Set backend-only secret in the server environment}
    ports:
      - "127.0.0.1:8787:8787"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    volumes:
      - xtank-settlements:/data/settlements
volumes:
  xtank-settlements:
