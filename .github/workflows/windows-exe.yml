name: Windows EXE build and GUI QA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'test/**'
      - 'electron/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test game rules
        run: npm test
      - name: Build bundled 3D game
        run: npm run build
      - name: Package portable EXE
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: XTANK-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Install GUI automation driver
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Run real portable Windows EXE GUI scenarios
        run: node scripts/windows-gui-qa.cjs
      - name: Upload GUI screenshots traces logs and verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XTANK-Windows-GUI-Evidence
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
