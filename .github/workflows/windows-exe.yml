name: Windows EXE build and GUI QA

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'server/**'
      - 'scripts/**'
      - 'test/**'
      - 'electron/**'
      - 'index.html'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/windows-exe.yml'
  workflow_dispatch:
    inputs:
      qa_filter:
        description: 'Optional targeted scenario regex; empty runs full build and QA'
        required: false
        default: ''
      exe_run_id:
        description: 'Existing EXE artifact run for targeted regression'
        required: false
        default: '40436598127'

permissions:
  contents: read

jobs:
  build-windows:
    if: github.event.head_commit.message != 'qa-targeted-only' && !inputs.qa_filter
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Test game rules
        run: npm test
      - name: Build bundled 3D game
        run: npm run build
      - name: Package portable EXE
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: XTANK-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Install GUI automation driver
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Run real portable Windows EXE GUI scenarios
        run: node scripts/windows-gui-qa.cjs
      - name: Upload GUI screenshots traces logs and verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: XTANK-Windows-GUI-Evidence
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30

  targeted-gui:
    permissions:
      contents: read
      actions: write
    if: github.event.head_commit.message == 'qa-targeted-only' || inputs.qa_filter
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: XTANK-Windows-Portable-EXE
          path: release
          run-id: ${{ inputs.exe_run_id || '40436598127' }}
          github-token: ${{ github.token }}
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Stop superseded reload-based full suite
        uses: actions/github-script@v7
        with:
          script: |
            const run = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: 40436598127});
            if (run.data.status !== 'completed') await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: 40436598127});
      - name: Targeted regression on the unchanged portable EXE
        run: node scripts/windows-gui-qa.cjs
        env:
          XTANK_QA_FILTER: ${{ inputs.qa_filter || '^B-' }}
      - name: Close owned game processes before evidence upload
        if: always()
        shell: pwsh
        run: Get-Process -Name 'XTANK*','X-TANK*' -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XTANK-Targeted-GUI-Evidence
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30
