name: Windows EXE build and scoped GUI QA
on:
  push:
    branches: [main]
    paths: ['src/**', 'server/**', 'scripts/**', 'test/**', 'electron/**', 'index.html', 'package.json', 'vite.config.js', 'Dockerfile', '.dockerignore', 'compose.official.example.yml', '.github/workflows/windows-exe.yml']
  workflow_dispatch:
    inputs:
      qa_filter:
        description: 'Scenario regex; use ^ for full suite'
        required: false
        default: '^(A-|C-(wall-clock|WASD|Escape))'
permissions:
  contents: read
concurrency:
  group: xtank-windows-gui
  cancel-in-progress: true
jobs:
  windows-qa:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Stop superseded expensive matrix run
        uses: actions/github-script@v7
        with:
          script: |
            const r = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: 40439154319});
            if (r.data.status !== 'completed') await github.rest.actions.cancelWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: 40439154319});
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: XTANK-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Actual portable EXE scoped GUI test (not full acceptance)
        run: node scripts/windows-gui-qa.cjs
        env:
          XTANK_QA_FILTER: ${{ inputs.qa_filter || '^(A-|C-(wall-clock|WASD|Escape))' }}
      - name: Close owned game processes
        if: always()
        shell: pwsh
        run: Get-Process -Name 'XTANK*','X-TANK*' -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XTANK-Scoped-GUI-Evidence
          path: qa-evidence/
          if-no-files-found: error
          retention-days: 30

  linux-server-smoke:
    name: Official server Docker packaging & health
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build official server image with compiled engine
        run: docker build --tag xtank-server:qa .
      - name: Verify compiled engine, start server, health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node xtank-server:qa -e "require('./server/engine.cjs'); console.log('Compiled combat engine loaded')"
          docker run --detach --name xtank-server-qa --publish 127.0.0.1:18787:8787 xtank-server:qa
          trap 'docker rm -f xtank-server-qa >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 35); do
            if curl --silent --fail http://127.0.0.1:18787/health > /tmp/xtank-health.json; then break; fi
            sleep 1
          done
          node -e "const x=require('/tmp/xtank-health.json'); if(!x.ok || x.rooms!==0) process.exit(1);"
          docker logs xtank-server-qa
