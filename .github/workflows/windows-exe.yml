name: Windows EXE build and 72-case GUI QA
on:
  push:
    branches: [main, 'release-validation/**']
    paths: ['src/**', 'server/**', 'scripts/**', 'test/**', 'electron/**', 'index.html', 'package.json', 'vite.config.js', 'Dockerfile', '.dockerignore', 'compose.official.example.yml', '.github/workflows/windows-exe.yml']
  workflow_dispatch:
    inputs:
      qa_filter:
        description: 'Scenario regex; ^ runs full native Windows GUI QA'
        required: false
        default: '^'
permissions:
  contents: read
concurrency:
  # Main pushes retain latest-only semantics, but a pinned validation branch
  # can finish its 72-case GUI matrix while other development continues.
  group: xtank-windows-gui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-build:
    name: Unit tests, Vite build and portable Windows EXE
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: XTANK-Windows-Portable-EXE
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Upload independent Electron binary for dual-client acceptance
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/release-validation/')
        uses: actions/upload-artifact@v4
        with:
          name: XTANK-Windows-Unpacked
          path: release/win-unpacked/
          if-no-files-found: error
          retention-days: 10

  windows-gui-shards:
    if: github.ref != 'refs/heads/release-validation/20261028-dual-bootstrap'
    name: Real EXE - ${{ matrix.group }}
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: tank-X, filter: '^B-X-'}
          - {group: tank-D, filter: '^B-D-'}
          - {group: tank-M, filter: '^B-M-'}
          - {group: tank-R, filter: '^B-R-'}
          - {group: tank-H, filter: '^B-H-'}
          - {group: tank-A, filter: '^B-A-'}
          - {group: tank-O, filter: '^B-O-'}
          - {group: tank-S, filter: '^B-S-'}
          - {group: smoke, filter: '^(A-|C-(wall-clock|WASD|Escape))'}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: XTANK-Windows-Portable-EXE
          path: release
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Run real packaged EXE in cloud Windows
        run: node scripts/windows-gui-qa.cjs
        env:
          XTANK_QA_FILTER: ${{ matrix.filter }}
          XTANK_QA_OUT: qa-evidence/${{ matrix.group }}
      - name: Close game processes
        if: always()
        shell: pwsh
        run: Get-Process -Name 'XTANK*','X-TANK*' -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XTANK-GUI-${{ matrix.group }}
          path: qa-evidence/${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 30

  windows-extended-qa:
    name: Real EXE - additional weapons, items and multiplayer
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/release-validation/20261028-dual-bootstrap'
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: XTANK-Windows-Portable-EXE
          path: release
      - name: Fetch unpacked Windows EXE as independent second process
        uses: actions/download-artifact@v4
        with:
          name: XTANK-Windows-Unpacked
          path: release/win-unpacked
      - run: npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.56.1
      - name: Extended native EXE QA
        run: node scripts/windows-gui-qa.cjs
        env:
          XTANK_QA_FILTER: '^D-dual-client-bootstrap\x24'
          XTANK_QA_OUT: qa-evidence/extended
      - name: Close game processes
        if: always()
        shell: pwsh
        run: Get-Process -Name 'XTANK*','X-TANK*' -ErrorAction SilentlyContinue | Stop-Process -Force
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XTANK-GUI-Extended
          path: qa-evidence/extended/
          if-no-files-found: warn
          retention-days: 30

  linux-server-smoke:
    name: Official server Docker packaging & health
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Build official server image with compiled engine
        run: docker build --tag xtank-server:qa .
      - name: Verify compiled engine, start server, health endpoint
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint node xtank-server:qa -e "require('./server/engine.cjs'); console.log('Compiled combat engine loaded')"
          docker run --detach --name xtank-server-qa --publish 127.0.0.1:18787:8787 xtank-server:qa
          trap 'docker rm -f xtank-server-qa >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 35); do
            if curl --silent --fail http://127.0.0.1:18787/health > /tmp/xtank-health.json; then break; fi
            sleep 1
          done
          node -e "const x=require('/tmp/xtank-health.json'); if(!x.ok || x.rooms!==0) process.exit(1);"
          docker logs xtank-server-qa
