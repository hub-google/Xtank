name: X-TANK eight-player repeated-round soak acceptance
on:
  push:
    branches:
      - release-validation/2026-10-29-soak-rematch
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: xtank-soak-final-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fast-rematch:
    name: Real 8-player rematches accelerated for isolated CI
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Live authoritative WebSockets, at least three naturally ending matches
        shell: bash
        env:
          NODE_ENV: test
          XTANK_SOAK_SECONDS: '75'
          XTANK_SOAK_TEST_ROUND_SECONDS: '6'
          XTANK_SOAK_REPORT: qa-evidence/rematch-fast.json
        run: |
          mkdir -p qa-evidence
          node scripts/soak-wss.cjs
          node -e "const r=require('./qa-evidence/rematch-fast.json');if(r.rounds<3||r.disconnected!==0||r.errors.length)throw Error('Insufficient confirmed round completions: '+JSON.stringify(r))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XTANK-Rematch-75sec-QA
          path: qa-evidence/
          retention-days: 30
          if-no-files-found: warn
  long-run:
    name: Real 8-player 30-minute multiple-round soak
    needs: fast-rematch
    runs-on: ubuntu-latest
    timeout-minutes: 39
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Real 8-player server for 1800 seconds, natural rematches
        shell: bash
        run: |
          mkdir -p qa-evidence
          XTANK_SOAK_SECONDS=1800 XTANK_SOAK_REPORT=qa-evidence/rematch-30min.json node scripts/soak-wss.cjs
          node -e "const r=require('./qa-evidence/rematch-30min.json');if(r.rounds<3||r.disconnected!==0||r.errors.length)throw Error('Missing cross-round acceptance: '+JSON.stringify(r))"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: XTANK-Rematch-30min-QA
          path: qa-evidence/
          retention-days: 30
          if-no-files-found: warn
